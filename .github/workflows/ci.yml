name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Skip CI when the agent-asset sync bot pushes .agents/ from CopodServices/agents.
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'Agents Sync'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cpod
          POSTGRES_PASSWORD: cpod
          POSTGRES_DB: cpod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpod -d cpod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://cpod:cpod@localhost:5432/cpod
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Docker tags must be lowercase; GHCR rejects "CopodServices/mail".
      - name: Image name
        id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Build information
        id: build_info
        run: echo "tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> ${GITHUB_OUTPUT}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: "${{ github.event_name == 'push' }}"
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:${{ steps.build_info.outputs.tag }}
            ghcr.io/${{ steps.image.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web
    runs-on: ubuntu-latest
    # Skip CI when the agent-asset sync bot pushes .agents/ from CopodServices/agents.
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'Agents Sync'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: bun run lint

      - name: Test
        working-directory: web
        run: bun test

  docker-web:
    name: Docker (web)
    runs-on: ubuntu-latest
    needs:
      - check
      - web
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Docker tags must be lowercase; GHCR rejects "CopodServices/mail".
      - name: Image name
        id: image
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Build information
        id: build_info
        run: echo "tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> ${GITHUB_OUTPUT}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The web client is its own image (nginx serving the static export), built
      # from web/ and published next to the API as ghcr.io/<owner>/mail-web.
      - name: Build web image (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: "${{ github.event_name == 'push' }}"
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}-web:${{ steps.build_info.outputs.tag }}
            ghcr.io/${{ steps.image.outputs.repo }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
